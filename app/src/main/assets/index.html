<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>نقطة شحن أبو عنزة</title>
<style>
:root{--g:#2e9e5b;--gd:#1f7a43;--o:#f2761b;--bg:#f6f4ef;--t:#1d2b24;--m:#6b7770;--r:#d64545;--w:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font-family:"Noto Naskh Arabic","Droid Arabic Naskh","Traditional Arabic",system-ui,sans-serif;font-size:16px;padding-bottom:90px}
button,input,select,textarea{font-family:inherit;font-size:inherit}
header{background:var(--w);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0001}
.brand{display:flex;align-items:center;gap:8px;font-size:19px}
.logo{background:linear-gradient(135deg,var(--o),var(--g));color:#fff;border-radius:10px;width:34px;height:34px;display:grid;place-items:center}
.bell{position:relative;background:none;border:0;font-size:23px;cursor:pointer;margin-inline-start:4px}
.bell i{position:absolute;top:-4px;left:-4px;background:var(--r);color:#fff;border-radius:10px;font-size:12px;font-style:normal;min-width:18px;padding:0 4px}
.off{background:#3b3b3b;color:#fff;font-size:13px;padding:6px 12px;text-align:center}
.demo{margin:8px 14px 0;font-size:13px;color:var(--m);background:#fff7e8;border-radius:10px;padding:6px 10px}
main{padding:12px 14px}
h3{margin:18px 0 8px;font-size:18px;display:flex;align-items:center;gap:8px}
.cnt{background:var(--o);color:#fff;border-radius:10px;padding:0 8px;font-size:14px}
.hero{background:linear-gradient(120deg,#fbd9bd,#d7efdc);border-radius:18px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero h2{margin:2px 0 0;font-size:22px}.hero small{color:var(--m)}
.badge{background:var(--g);color:#fff;border-radius:14px;padding:10px 12px;font-weight:bold;text-align:center}
.tiles{display:flex;gap:10px;margin-top:12px}
.tile{flex:1;border-radius:16px;padding:12px;color:#fff;border:3px solid transparent;cursor:pointer}
.tile.o{background:var(--o)}.tile.g{background:var(--g)}.tile.d{background:#3d4f46}
.tile small{display:block;opacity:.95;font-size:12.5px}.tile b{font-size:21px;display:block;margin:2px 0}
.tile.sel{border-color:#1d2b24}
.card,.rq,.er,.ph,.cr{background:var(--w);border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:0 1px 4px #0001}
.card small,.rq small,.er small,.ph small,.cr small{display:block;color:var(--m);font-size:13px}
.cr{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:bold;flex:none}
.cr .info{flex:1}
.mini{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.mini span{flex:1;border-radius:8px;padding:4px 6px;font-size:13px;text-align:center}
.mini .c{background:#fde6d2;color:#a24d0a}.mini .s{background:#d9f0e1;color:var(--gd)}
.mini button{flex:1;padding:6px 8px;font-size:13px}
.rq,.ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
button.ok,button.no,button.pr,button.sc{border:0;border-radius:10px;padding:8px 12px;font-weight:bold;cursor:pointer}
button.ok,button.pr{background:var(--g);color:#fff}button.no{background:#fde0e0;color:var(--r)}
button.sc{background:#fde6d2;color:#a24d0a}
.er{display:flex;justify-content:space-between;gap:8px;border-right:5px solid var(--o)}
.er.pay{border-right-color:var(--g)}
.er>div:first-child{flex:1}
.chip{align-self:flex-start;display:block;font-size:12px;border-radius:8px;padding:2px 8px;text-align:center;white-space:nowrap}
.chip.ok{background:#d9f0e1;color:var(--gd)}.chip.aw_c{background:#fff1cc;color:#8a6200}.chip.dis{background:#fde0e0;color:var(--r)}
.warn{color:var(--r)!important}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.acts button{flex:1;min-width:110px}
.cb img{width:100%;border-radius:10px;margin:6px 0}.cb input{width:100%;padding:10px;border:1.5px solid #cfd8d2;border-radius:10px;text-align:center;direction:ltr;letter-spacing:4px;font-size:20px;margin:4px 0 8px}
.back{background:none;border:0;color:var(--gd);font-weight:bold;padding:4px 0;font-size:17px}
.empty{color:var(--m);text-align:center;padding:14px;font-size:14px}
.fab{position:fixed;bottom:84px;left:16px;background:var(--o);color:#fff;border:0;border-radius:26px;padding:12px 18px;font-weight:bold;box-shadow:0 4px 12px #0004;z-index:4}
nav{position:fixed;bottom:0;right:0;left:0;background:#fff;display:flex;box-shadow:0 -2px 10px #0002;z-index:5}
nav button{flex:1;background:none;border:0;padding:8px 2px 10px;color:var(--m);font-size:12.5px;position:relative}
nav button span{display:block;font-size:21px}
nav button.on{color:var(--o);font-weight:bold}
nav button i{position:absolute;top:2px;right:50%;margin-right:-20px;background:var(--r);color:#fff;border-radius:10px;font-size:11px;font-style:normal;padding:0 5px}
.ov{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end}
.sh{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:16px;max-height:88vh;overflow:auto}
.sh h4{margin:0 0 10px;font-size:19px}
.sh label{display:block;margin:8px 0 4px;color:var(--m);font-size:14px}
.sh input,.sh select,.sh textarea,.card input.srch{width:100%;padding:10px;border:1.5px solid #cfd8d2;border-radius:10px;background:#fafafa}
.sh textarea{min-height:140px;direction:ltr;font-size:12px}
.sh .row{display:flex;gap:8px;margin-top:14px}.sh .row button{flex:1;padding:11px}
.nt{padding:10px;border-bottom:1px solid #eee}.nt.u{background:#fff8ec}.nt small{color:var(--m);display:block}
.srch{width:100%;padding:10px;border:1.5px solid #cfd8d2;border-radius:12px;margin-bottom:10px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#1d2b24;color:#fff;padding:8px 16px;border-radius:20px;z-index:50;font-size:14px}
code{background:#eef3ef;padding:1px 6px;border-radius:6px;direction:ltr;display:inline-block}
.per{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.per button{border:1.5px solid var(--g);background:#fff;color:var(--gd);border-radius:20px;padding:5px 12px}.per button.on{background:var(--g);color:#fff}
details.card summary{cursor:pointer;font-weight:bold}
.login{padding:24px 16px}.login h1{text-align:center;margin:10px 0 18px}.login .card input{margin-bottom:8px;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
var KEY='abuanza_v3',ACC={charge:'شحن',shop:'مشتريات'};
var S,U={tab:'home',ctab:'home',cid:null,acct:'charge',sheet:null,panel:false,per:'carry'};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var fmt=function(n){return Number(n||0).toLocaleString('en-US')+' ₪'};
var digits=function(s){return String(s).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/\D/g,'')};
var num=function(s){var n=parseFloat(String(s).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace('٫','.').replace(',','.'));return isNaN(n)?null:n};
var ago=function(t){var m=Math.max(0,Math.round((Date.now()-t)/60000));if(m<1)return'الآن';if(m<60)return'منذ '+m+' دقيقة';var h=Math.round(m/60);if(h<24)return'منذ '+h+' ساعة';return'منذ '+Math.round(h/24)+' يوم'};
var DOW=function(t){try{return new Date(t).toLocaleDateString('ar-u-nu-latn',{weekday:'long'})}catch(e){return''}};
var DT=function(t){var d=new Date(t),p=function(x){return(x<10?'0':'')+x};return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' · '+DOW(t)+' '+p(d.getHours())+':'+p(d.getMinutes())};
var cust=function(id){return S.custs.find(function(c){return c.id===id})};
var cname=function(id){var c=cust(id);return c?c.name:'—'};
var role=function(){return S.sess?S.sess.role:null};
var me=function(){return S.sess?S.sess.cid:null};
var isO=function(){return role()==='owner'};
var vk=function(){return isO()?'owner':me()};

function demoImg(){var t='<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260"><rect width="600" height="260" rx="18" fill="#eef4fb"/><text x="300" y="70" font-size="44" text-anchor="middle" fill="#2a4fb5" font-family="Arial" font-weight="bold">B.net connect</text><text x="300" y="150" font-size="46" text-anchor="middle" fill="#2a4fb5" font-family="Arial" font-weight="bold">9707 3898 1234</text><text x="300" y="215" font-size="30" text-anchor="middle" fill="#777" font-family="Arial">(صورة تجريبية)</text></svg>';return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(t)}
function seed(){
  var n=Date.now(),H=3600000,D=24*H;
  var O=function(cid,acct,kind,desc,s,c,ago){return{id:uid(),cid:cid,acct:acct,kind:kind,desc:desc,s:s,c:c,ts:n-ago,cyc:null}};
  var k=O('c2','shop','buy','بطاقة B.net — 1 شيكل',1,null,180000);k.cardId='k1';
  return{shop:'نقطة شحن أبو عنزة',pin:'1234',
   custs:[{id:'c1',name:'أحمد السالم',phone:'0501234567',pin:'1111',devs:[{id:'d1',name:'iPhone 13'}]},
          {id:'c2',name:'فاطمة العنزي',phone:'0559876543',pin:'2222',devs:[{id:'d2',name:'Samsung A54'}]},
          {id:'c3',name:'خالد العتيبي',phone:'0545551122',pin:'3333',devs:[{id:'d3',name:'Xiaomi Redmi'}]}],
   ops:[O('c1','charge','buy','شحن جوال',120,120,3*D),O('c1','charge','pay','',50,50,D),O('c1','shop','buy','كيبل شحن',25,null,2*H),
        O('c2','shop','buy','سماعات',110,110,2*D),O('c2','charge','buy','شحن جوال',45,40,5*H),
        O('c3','charge','buy','شحن باور بانك',null,30,3*H),O('c3','charge','pay','',null,20,H),k],
   phones:[{id:uid(),cid:'c1',dev:'iPhone 13',ts:n-40*60000,st:'ch'},{id:uid(),cid:'c3',dev:'Xiaomi Redmi',ts:n-90*60000,st:'ch'}],
   cards:[{id:'k1',cid:'c2',name:'بطاقة B.net — 1 شيكل',price:1,code:'1234',img:demoImg(),st:'sent',ts:n-180000,delAt:0,tries:0,oid:k.id}],
   notes:[],cycles:[],carry:{from:0,hist:[]},sess:null};
}
function load(){try{var j=localStorage.getItem(KEY);if(j){var o=JSON.parse(j);o.cards=o.cards||[];o.cycles=o.cycles||[];o.carry=o.carry||{from:0,hist:[]};return o}}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2400)}
function note(to,text){S.notes.unshift({id:uid(),to:to,text:text,ts:Date.now(),read:false})}

/* ---------- منطق الدفتر ---------- */
var op=function(id){return S.ops.find(function(o){return o.id===id})};
var opTitle=function(o){return o.kind==='pay'?'دفعة نقدية':o.desc};
function st(o){ // ok | dis | ws (ينتظر البائع) | wc (ينتظر الزبون)
  if(o.s==null)return'ws';
  if(o.kind==='pay')return(o.c==null||o.c===o.s)?'ok':'dis';
  if(o.c==null)return'wc';
  return o.s===o.c?'ok':'dis';
}
function act(cid,acct){return S.ops.filter(function(o){return o.cid===cid&&!o.cyc})}
function tot(cid,acct,side){
  return act(cid,acct).reduce(function(t,o){
    var v=side==='s'?o.s:((o.kind==='pay'&&o.c==null)?o.s:o.c);
    if(v==null)return t;return t+(o.kind==='buy'?v:-v);
  },0);
}
function sumS(){return S.custs.reduce(function(t,c){return t+tot(c.id,'','s')},0)}
function needS(){return S.ops.filter(function(o){return!o.cyc&&(st(o)==='ws'||st(o)==='dis')}).sort(function(a,b){return b.ts-a.ts})}
function needC(cid){return S.ops.filter(function(o){return o.cid===cid&&!o.cyc&&(st(o)==='wc'||st(o)==='dis')})}
function waitC(){return S.ops.filter(function(o){return!o.cyc&&st(o)==='wc'})}
function tryClose(cid,acct){
  var L=act(cid,acct);
  if(!L.length||L.some(function(o){return st(o)!=='ok'}))return;
  if(tot(cid,acct,'s')!==0||tot(cid,acct,'c')!==0)return;
  if(!L.some(function(o){return o.kind==='pay'}))return;
  var cy=uid();S.cycles.push({id:cy,cid:cid,acct:acct,ts:Date.now()});
  L.forEach(function(o){o.cyc=cy});
  note(cid,'✓ أُغلق الحساب وصُفّر العداد، وحُفظت الدفعات في الأرشيف');
  note('owner','✓ '+cname(cid)+': أُغلق الحساب (تصفير)');
}
function noteOther(o,txt){if(isO())note(o.cid,'البائع '+txt);else note('owner',cname(o.cid)+' '+txt)}
function createRec(side,cid,acct,kind,desc,m){
  var other=side==='s'?'c':'s',now=Date.now();
  var o=S.ops.find(function(x){return x.cid===cid&&x.kind===kind&&!x.cyc&&x[side]==null&&x[other]===m&&Math.abs(now-x.ts)<36*3600000});
  if(o){o[side]=m;if(!o.desc&&desc)o.desc=desc;toast('طابق تسجيل الطرف الآخر ✓')}
  else{o={id:uid(),cid:cid,acct:acct,kind:kind,desc:desc,s:null,c:null,ts:now,cyc:null};o[side]=m;S.ops.push(o);toast('تم التسجيل — بانتظار الطرف الآخر')}
  note(side==='s'?cid:'owner',(side==='s'?'البائع سجّل ':cname(cid)+' سجّل ')+opTitle(o)+' '+fmt(m)+(kind==='buy'?' ('+ACC[acct]+')':'')+' — راجعه وأكّد');
  tryClose(cid,acct);return o;
}
function adopt(id){var o=op(id);if(isO())o.s=o.c;else o.c=o.s;noteOther(o,'أكّد '+opTitle(o)+' '+fmt(isO()?o.s:o.c));tryClose(o.cid,o.acct);save();render();toast('تم التأكيد')}
function editMine(id){
  var o=op(id),sw=isO();
  openSheet((sw?o.s:o.c)==null?'تسجيل مبلغي':'تعديل مبلغي',[{id:'m',label:opTitle(o)+' (₪)',type:'num',value:(sw?o.s:o.c)==null?'':String(sw?o.s:o.c)}],'حفظ',function(v){
    var m=num(v.m);if(!(m>0)){toast('أدخل مبلغاً صحيحاً');return false}
    o[sw?'s':'c']=m;noteOther(o,'سجّل/عدّل مبلغه في '+opTitle(o)+' إلى '+fmt(m));tryClose(o.cid,o.acct);
  });
}
function delMine(id){
  var o=op(id),sw=isO(),k=sw?'s':'c',oth=sw?'c':'s';
  if(o[oth]==null)S.ops=S.ops.filter(function(x){return x.id!==id});else o[k]=null;
  save();render();toast('حُذف تسجيلي');
}
function cands(o){
  var sOnly=o.s!=null&&o.c==null;
  return S.ops.filter(function(x){return x.id!==o.id&&x.cid===o.cid&&x.kind===o.kind&&!x.cyc&&(sOnly?(x.c!=null&&x.s==null):(x.s!=null&&x.c==null))});
}
function linkOp(id){
  var o=op(id),L=cands(o),sOnly=o.s!=null&&o.c==null;
  openSheet('ربط بتسجيل الطرف الآخر',[{id:'t',label:'هذه العملية هي نفسها:',type:'select',opts:L.map(function(x){return[x.id,opTitle(x)+' — '+fmt(sOnly?x.c:x.s)+' — '+DT(x.ts)]})}],'ربط',function(v){
    var x=op(v.t);if(!x)return false;
    if(sOnly)o.c=x.c;else o.s=x.s;
    S.ops=S.ops.filter(function(y){return y.id!==x.id});
    noteOther(o,'ربط تسجيلين لـ '+opTitle(o));tryClose(o.cid,o.acct);toast('تم الربط');
  });
}
function quickOp(kind){
  openSheet('اختر الزبون',[{id:'c',label:'الزبون',type:'select',opts:S.custs.map(function(c){return[c.id,c.name]})}],'التالي',function(v){U.sheet=null;setTimeout(function(){newOp(kind,v.c)},0);return false});
}
function newOp(kind,cc){
  var sw=isO(),cid=sw?(cc||U.cid):me();
  var f=[];
  if(kind==='buy')f.push({id:'a',label:'النوع',type:'select',opts:acctOpts(),value:U.acct},{id:'d',label:sw?'البيان (شحن / كيبل / ...)':'ماذا أخذت؟'});
  f.push({id:'m',label:'المبلغ (₪)',type:'num'});
  openSheet(kind==='buy'?(sw?'تسجيل بيع':'تسجيل ما أخذته'):(sw?'استلمت نقداً':'دفعت نقداً'),f,'تسجيل',function(v){
    var m=num(v.m);if(!(m>0)||(kind==='buy'&&!v.d)){toast('أكمل البيانات');return false}
    var ac=v.a||U.acct;U.acct=ac;createRec(sw?'s':'c',cid,ac,kind,v.d||'',m);
  });
}

/* ---------- نماذج ---------- */
function openSheet(title,fields,ok,fn){U.sheet={title:title,fields:fields,ok:ok,fn:fn};render()}
function closeSheet(){U.sheet=null;render()}
function submitSheet(){
  var v={};U.sheet.fields.forEach(function(f){v[f.id]=$('f_'+f.id).value.trim()});
  var r=U.sheet.fn(v);if(r===false)return;U.sheet=null;save();render();
}
function sheetHTML(){
  var s=U.sheet;
  var f=s.fields.map(function(x){
    var inp;
    if(x.type==='select')inp='<select id="f_'+x.id+'">'+x.opts.map(function(o){return'<option value="'+esc(o[0])+'"'+(o[0]===x.value?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>';
    else if(x.type==='file')inp='<input type="file" id="f_'+x.id+'" accept="image/*" capture="environment" onchange="pickImg(this)"><img id="imgprev" style="display:none;width:100%;border-radius:10px;margin-top:6px">';
    else if(x.type==='area')inp='<textarea id="f_'+x.id+'">'+esc(x.value||'')+'</textarea>';
    else inp='<input id="f_'+x.id+'" value="'+esc(x.value||'')+'"'+(x.type==='num'?' inputmode="decimal"':'')+(x.type==='tel'?' inputmode="tel"':'')+' placeholder="'+esc(x.ph||'')+'">';
    return'<label>'+esc(x.label)+'</label>'+inp;
  }).join('');
  return'<div class="ov" onclick="if(event.target===this)closeSheet()"><div class="sh"><h4>'+esc(s.title)+'</h4>'+f+'<div class="row"><button class="pr ok" onclick="submitSheet()">'+esc(s.ok)+'</button><button class="no" onclick="closeSheet()">إلغاء</button></div></div></div>';
}
var acctOpts=function(){return[['charge',ACC.charge],['shop',ACC.shop]]};

/* ---------- الدخول ---------- */
function loginOwner(){if($('opin').value.trim()!==S.pin){toast('الرمز غير صحيح');return}S.sess={role:'owner'};U.tab='home';U.cid=null;save();render()}
function loginCust(){
  var p=digits($('lph').value),c=S.custs.find(function(x){return digits(x.phone)===p&&x.pin===$('lpin').value.trim()});
  if(!p||!c){toast('الجوال أو الرمز غير صحيح');return}
  S.sess={role:'cust',cid:c.id};U.ctab='home';U.acct='charge';save();render();
}
function logout(){S.sess=null;U.cid=null;U.panel=false;U.sheet=null;save();render()}
function loginView(){
  return'<div class="login"><h1>⚡ '+esc(S.shop)+'</h1>'+
  '<div class="card"><b>صاحب النقطة</b><input id="opin" class="srch" type="password" inputmode="numeric" placeholder="الرمز السري"><button class="pr ok" style="width:100%;padding:11px" onclick="loginOwner()">دخول</button></div>'+
  '<div class="card"><b>زبون</b><input id="lph" class="srch" inputmode="tel" placeholder="رقم الجوال"><input id="lpin" class="srch" type="password" inputmode="numeric" placeholder="الرمز السري"><button class="sc" style="width:100%;padding:11px" onclick="loginCust()">دخول</button></div>'+
  '<div class="demo">نسخة تجريبية: رمز صاحب النقطة 1234. الزبائن: 0501234567 ← 1111، 0559876543 ← 2222، 0545551122 ← 3333. الحماية الحقيقية تأتي مع الربط بالخادم.</div></div>';

function sendCard(){
  IMG=null;
  openSheet('إرسال بطاقة — '+cname(U.cid),[{id:'i',label:'صوّر البطاقة',type:'file'},{id:'n',label:'نوع البطاقة',value:'بطاقة B.net — 1 شيكل'},{id:'p',label:'السعر (₪)',type:'num',value:'1'},{id:'k',label:'آخر 4 أرقام من رقم البطاقة (يكتبها الزبون لتأكيد الوصول)',type:'tel',ph:'مثال: 1201'}],'إرسال للزبون',function(v){

    var cid=uid(),o={id:uid(),cid:U.cid,acct:'shop',kind:'buy',desc:v.n,s:p,c:null,ts:Date.now(),cyc:null,cardId:cid};S.ops.push(o);
    S.cards.push({id:cid,cid:U.cid,name:v.n,price:p,code:k,img:IMG,st:'sent',ts:Date.now(),delAt:0,tries:0,oid:o.id});
    IMG=null;note(U.cid,'وصلتك بطاقة من النقطة. اكتب آخر 4 أرقام منها لتأكيد الوصول');toast('أُرسلت البطاقة');

function cancelCard(id){var c=S.cards.find(function(x){return x.id===id});S.ops=S.ops.filter(function(o){return o.id!==c.oid});S.cards=S.cards.filter(function(x){return x.id!==id});note(c.cid,'ألغت النقطة البطاقة '+c.name);save();render();toast('أُلغيت وحُذفت الصورة')}
function confirmCard(id){
  var c=S.cards.find(function(x){return x.id===id}),v=digits($('cc_'+id).value);

}

   (U.per==='carry'?'<div class="acts"><button class="pr ok" onclick="carryOver()">ترحيل المجموع وتصفير العداد</button></div>':'')+
   '<h3>كشف المدفوعات</h3>'+(L.length?L.map(function(o){return'<div class="er pay"><div><b>'+esc(cname(o.cid))+'</b><small>'+DT(o.ts)+'</small></div><b>'+fmt(o.s)+'</b></div>'}).join(''):'<div class="empty">لا توجد دفعات في هذه الفترة</div>')+
   (S.carry.hist.length?'<h3>سجل الترحيلات</h3>'+S.carry.hist.slice(0,8).map(function(h){return'<div class="er"><div><b>'+fmt(h.total)+'</b><small>'+DT(h.ts)+' · '+h.n+' دفعة</small></div></div>'}).join(''):'')+'</main>';
}
function acctTile(c){
  var s=tot(c,'','s'),k=tot(c,'','c'),d=s!==k;
  return'<div class="tile o"><small>الحساب — شحن ومشتريات</small><b>'+balTxt(s,1)+'</b><small>حسب دفترك</small><small>حسب الزبون: '+balTxt(k,1)+(d?' ⚠':'')+'</small></div>';
}
function custDetail(){
  var c=cust(U.cid),a=U.acct;
  return'<main><button class="back" onclick="back()">→ الزبائن</button><div class="card"><b style="font-size:19px">'+esc(c.name)+'</b><small>'+esc(c.phone)+' · رمز دخوله: <code>'+esc(c.pin)+'</code></small>'+
   '<h3 style="font-size:15px;margin:10px 0 4px">أجهزته</h3><div class="mini">'+(c.devs.map(function(d){return'<button class="sc" onclick="chargeDev(\''+c.id+'\',\''+d.id+'\')">⚡ شحن '+esc(d.name)+'</button>'}).join('')||'<small>لا أجهزة</small>')+'<button class="no" style="background:#eef3ef;color:var(--gd)" onclick="addDev()">+ جهاز</button></div>'+
   '<div class="acts"><button class="sc" onclick="sendWA()">إرسال الكشف واتساب</button></div></div>'+
   '<div class="tiles">'+acctTile(c.id)+'</div>'+
   '<div class="acts"><button class="pr ok" onclick="newOp(\'buy\')">+ بيع / شحن</button><button class="sc" onclick="newOp(\'pay\')">💵 استلمت</button><button class="sc" onclick="sendCard()">📷 بطاقة</button></div>'+
   '<h3>الدفتر</h3>'+ledger(c.id,a,'s')+'<h3>الأرشيف</h3>'+archive(c.id,'s')+'</main>';
}
function custTile(cid){
  var k=tot(cid,'','c'),s=tot(cid,'','s'),d=k!==s;
  return'<div class="tile o" onclick="U.ctab=\'led\';render()"><small>حسابي — شحن ومشتريات</small><b>'+balTxt(k,0)+'</b><small>حسب سجلي</small><small>حسب البائع: '+balTxt(s,0)+(d?' ⚠':'')+'</small></div>';
}
function custView(){
  var c=cust(me());
  if(!c){logout();return''}
  var top='<div class="card"><b>'+esc(c.name)+'</b><small>'+esc(c.phone)+' · أجهزتي: '+(c.devs.map(function(d){return esc(d.name)}).join('، ')||'—')+'</small></div>';
  if(U.ctab==='led'){
    var a=U.acct;
    return'<main>'+top+'<div class="tiles">'+custTile(c.id)+'</div>'+
     '<div class="acts"><button class="pr ok" onclick="newOp(\'buy\')">+ ما أخذته</button><button class="sc" onclick="newOp(\'pay\')">💵 دفعت</button></div><h3>دفتري</h3>'+ledger(c.id,a,'c')+'</main>';
  }
  if(U.ctab==='arc')return'<main>'+top+'<h3>الأرشيف</h3>'+archive(c.id,'c')+'</main>';
  var need=needC(c.id).filter(function(o){return!o.cardId});
  return'<main>'+top+'<div class="tiles">'+custTile(c.id)+'</div>'+
   '<div class="acts"><button class="pr ok" onclick="newOp(\'buy\')">+ ما أخذته</button><button class="sc" onclick="newOp(\'pay\')">💵 دفعت</button></div>'+
   '<h3>بطاقات واردة</h3>'+cardsCust(c.id)+
   '<h3>تحتاج تأكيدك <span class="cnt">'+need.length+'</span></h3>'+opList(need,'c',false,'لا شيء بانتظارك ✓')+
   '<h3>جوالاتي على الشحن</h3>'+phonesList(S.phones.filter(function(p){return p.cid===c.id}),false)+'</main>';
}
function notesHTML(){
  var k=vk(),L=S.notes.filter(function(n){return n.to===k}).slice(0,40);
  return'<div class="ov" onclick="if(event.target===this)closeNotes()"><div class="sh"><h4>الإشعارات</h4>'+(L.length?L.map(function(n){return'<div class="nt'+(n.read?'':' u')+'">'+esc(n.text)+'<small>'+ago(n.ts)+'</small></div>'}).join(''):'<div class="empty">لا توجد إشعارات</div>')+'<div class="row"><button class="no" onclick="closeNotes()">إغلاق</button></div></div></div>';
}
function render(){
  cleanup();var y=window.pageYOffset||0;
  if(!S.sess){$('app').innerHTML=loginView();return}
  $('app').innerHTML=hdr()+(isO()?ownerView():custView())+nav()+(U.sheet?sheetHTML():'')+(U.panel?notesHTML():'');
  window.scrollTo(0,y);
}
S=load();save();render();
window.addEventListener('online',render);window.addEventListener('offline',render);
setInterval(function(){if(!U.sheet&&cleanup())render()},20000);
</script>
</body>
</html>
